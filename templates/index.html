<!DOCTYPE html>
<html>
<head>
    <title>Chemsong</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #121212; /* Dark background */
            color: #fff; /* Light text color */
        }
        .container { 
            width: 90%;
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background-color: #1e1e1e; /* Slightly lighter dark background */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }
        .header { 
            text-align: center; 
            margin-bottom: 20px;
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        .image-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .step-container {
            border: 1px solid #333;
            padding: 10px;
            border-radius: 5px;
        }
        .step-container h3 {
            margin-top: 0;
        }
        .step-container img {
            max-width: 100%;
            height: auto;
            margin: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            background-color: #007bff; /* Button background */
            color: white; /* Button text color */
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #333; /* Darker border */
            background-color: #2a2a2a; /* Dark input background */
            color: white; /* Light input text color */
        }
        #logArea {
            position: fixed;
            left: -33%; /* Start off-screen */
            width: 33%;
            height: 100vh;
            overflow: auto;
            background-color: rgba(30, 30, 30, 0.9);
            transition: left 0.3s ease-in-out;
            padding: 20px;
            box-sizing: border-box;
        }
        #logToggle {
            position: fixed;
            left: 10px;
            bottom: 10px;
            z-index: 1000;
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        /* Responsive Design */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }
            .form-group {
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CHEMSONG</h1>
            <img src="/static/images/chemsong.png" alt="Chemsong Image" style="width: 250px;">
        </div>

        <form id="processForm" action="/process" method="post">
            <div>
                <label>Select musical scale:</label>
                <select name="musical_scale">
                    <option value="a_minor">a_minor</option>
                    <option value="a_major">a_major</option>
                    <option value="a_minor_h">a_minor_h</option>
                    <option value="b_minor">b_minor</option>
                    <option value="b_major">b_major</option>
                </select>
            </div>

            <div>
                <p>Enter SMILES notation for each step, separate molecules with a space.
                    Alternately, smash 'random step' a bunch then hit process.
                </p>
            </div>

            <div class="button-group_1">
                <button type="button" onclick="addStep()">Add Step</button>
                <button type="button" onclick="addRandomStep()">Add Random Step</button>
                <button type="button" onclick="resetForm()">Reset</button>
            </div>
            
            <div class="button_group_2">
                <button type="submit">Process</button>
            </div>

            <div class="form-group">
                <!-- Additional input fields will be dynamically added here -->
            </div>
        </form>

        <div class="image-container">
            <!-- Images will be displayed here -->
        </div>

        <div>
            <br><br>
            <a href="/smiles-guide">SMILES Notation Guide</a>
        </div>
    </div>

    <button id="logToggle">Show Logs</button>
    <div id="logArea">
        <!-- Logs will be displayed here -->
    </div>

    <script type="text/javascript">
        var stepCount = 1;
        var audioContext;   
        var reverbNode;

        function initAudioContext() {
            audioContext = new AudioContext();
            reverbNode = createReverbNode(audioContext);
        }

        function createReverbNode(audioContext) {
            const convolver = audioContext.createConvolver();
            fetch('static/audio/reverb.wav')
                .then(response => response.arrayBuffer())
                .then(arrayBuffer => audioContext.decodeAudioData(arrayBuffer))
                .then(audioBuffer => {
                    convolver.buffer = audioBuffer;
                })
                .catch(e => console.log('Error with decoding audio data', e));
            return convolver;
        }

        function addStep() {
            stepCount++;
            var inputDiv = document.createElement('div');
            inputDiv.className = 'form-group';
            inputDiv.innerHTML = '<input type="text" name="smiles_entry_' + stepCount + '" style="width: 250px;" />';
            document.querySelector('form').appendChild(inputDiv);
        }

        function addRandomStep() {
            fetch('/generate_random_step')
                .then(response => response.json())
                .then(randomStep => {
                    stepCount++;
                    var inputDiv = document.createElement('div');
                    inputDiv.className = 'form-group';
                    inputDiv.innerHTML = '<input type="text" name="smiles_entry_' + stepCount + '" style="width: 250px;" value="' + randomStep + '" />';
                    document.querySelector('form').appendChild(inputDiv);
                })
                .catch(error => console.error('Error:', error));
        }

        function resetForm() {
            window.location.reload();
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('processForm').addEventListener('submit', function(e) {
                e.preventDefault();

                if (!audioContext) {
                    initAudioContext();
                }

                var formData = new FormData(this);

                fetch('/process', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.images) {
                        document.querySelector('.image-container').innerHTML = '';
                        
                        data.images.forEach((stepImages, stepIndex) => {
                            const stepContainer = document.createElement('div');
                            stepContainer.className = 'step-container';
                            stepContainer.innerHTML = `<h3>Step ${stepIndex + 1}</h3>`;
                            
                            stepImages.forEach((encodedImg, moleculeIndex) => {
                                var img = new Image();
                                img.src = 'data:image/png;base64,' + encodedImg;
                                img.alt = `Step ${stepIndex + 1}, Molecule ${moleculeIndex + 1}`;
                                stepContainer.appendChild(img);
                            });
                            
                            document.querySelector('.image-container').appendChild(stepContainer);
                        });
                    }

                    if (data.midiNotes) {
                        let totalTime = 0;
                        const pauseBetweenSublists = 500;
                        const pauseBetweenNotes = 250;

                        data.midiNotes.forEach(sublist => {
                            sublist.forEach(noteData => {
                                if (noteData.note_on !== undefined) {
                                    setTimeout(() => {
                                        const frequency = midiNoteToFrequency(noteData.note_on);
                                        if (frequency) {
                                            createSynthSound(frequency);
                                        }
                                    }, totalTime);
                                    totalTime += noteData.time + pauseBetweenNotes;
                                }
                            });
                            totalTime += pauseBetweenSublists;
                        });
                    }
                })
                .catch(error => console.error('Error:', error));
            });
        });

        function fetchLogs() {
            fetch('/get-logs')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('logArea').innerHTML = '<pre>' + data.logs + '</pre>';
                })
                .catch(error => console.error('Error fetching logs:', error));
        }

        function midiNoteToFrequency(note) {
            if (!Number.isFinite(note)) {
                console.error('Invalid note value:', note);
                return null;
            }
            return Math.pow(2, (note - 69) / 12) * 440 + 25;
        }

        function createSynthSound(frequency, duration = 0.5) {
            if (!Number.isFinite(frequency)) {
                console.error('Invalid frequency value:', frequency);
                return;
            }

            const oscillator = audioContext.createOscillator();
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);

            const gainNode = audioContext.createGain();
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.7, audioContext.currentTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(frequency * 2, audioContext.currentTime);
            filter.frequency.exponentialRampToValueAtTime(frequency / 2, audioContext.currentTime + duration);
            filter.Q.setValueAtTime(10, audioContext.currentTime);

            const panner = audioContext.createStereoPanner();
            panner.pan.setValueAtTime(Math.sin(audioContext.currentTime * 2) * 0.5, audioContext.currentTime);

            oscillator.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(panner);
            panner.connect(reverbNode);
            reverbNode.connect(audioContext.destination);

            oscillator.start();
            oscillator.stop(audioContext.currentTime + duration);
        }

        document.getElementById('logToggle').addEventListener('click', function() {
            var logArea = document.getElementById('logArea');
            var logToggle = document.getElementById('logToggle');
            if (logArea.style.left === '0px') {
                logArea.style.left = '-33%';
                logToggle.textContent = 'Show Logs';
            } else {
                logArea.style.left = '0px';
                logToggle.textContent = 'Hide Logs';
            }
        });

        setInterval(fetchLogs, 5000);
    </script>
</body>
</html>
